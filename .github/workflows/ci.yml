name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual escape hatch: lets CI run when GitHub webhook delivery drops the
  # pull_request/push event (dispatches go straight to Actions, not via hooks).
  workflow_dispatch:

jobs:
  # Postgres is no longer the exception, it is the store (docs/WEB-APP.md).
  # Every job that runs a test needs one, which inverts the previous file: it
  # had a no-database `rust` job and a single `importer` job holding the only
  # Postgres in CI. That split described the op-log/SQLite architecture and
  # both of the crates it named are gone.
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not plain postgres: embeddings live in a vector column and
        # the schema will not create without the extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # No webkit/gtk any more: those were hive-app's, and the desktop shell is
      # a browser now. What remains is the vendored-OpenSSL/cmake closure.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev cmake

      # Matches rust-toolchain.toml so local fmt/clippy and CI agree.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hive-rust

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo build
        run: cargo build --workspace --all-targets

      # The container ships the RELEASE binary, and borrow-check can differ
      # between opt levels (temporary lifetimes): a move-then-borrow that
      # passes in debug/clippy/test can fail only under --release. Build the
      # shipped binary in release so that class is caught here, not at
      # packaging time.
      - name: Cargo build (release, api)
        run: cargo build --release -p hive-api

      - name: Cargo test
        env:
          # hive-embed's default provider is transformers, whose lazy ONNX
          # engine would try to pull BGE models from the HF hub on a stray
          # first embed. Pin CI offline and fast.
          HIVE_EMBED: hash
          # api/tests/org_isolation.rs provisions an unprivileged role and
          # serves as it, so this role must be able to CREATE ROLE. The
          # image's POSTGRES_USER is a superuser, which satisfies it.
          DATABASE_URL: postgres://hive:hive@127.0.0.1:5432/hive
          HIVE_CRED_KEY: ci-credential-vault-key-not-a-secret
        run: cargo test --workspace

  # The SPA is shipped by the API (routes/spa.rs serves HIVE_WEB_DIST), so a
  # frontend that does not build is a broken release even when Rust is green.
  # Building is not enough on its own, though, hence the typecheck below.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      # CI=true so a stale node_modules is purged rather than prompting for a
      # confirmation no runner can answer.
      - name: Install
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      # vite build transpiles with esbuild, which strips types without ever
      # checking them, so a type error anywhere in the SPA still bundles clean.
      # tsc is the only thing that reads packages/web/tsconfig.json's `strict`.
      # Runs first: a type error is cheaper to surface than a full bundle.
      - name: Typecheck the SPA
        env:
          CI: 'true'
        run: pnpm --filter @hive/web typecheck

      - name: Build the SPA
        env:
          CI: 'true'
        run: pnpm --filter @hive/web build
