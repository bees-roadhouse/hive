[package]
name = "hive-smoke-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The smoke tier's seams open REAL stores over real dirs, so unlike
# hive-bridge (store-free by design) this crate does link the engine: hive-core
# for Store/KeySource, hive-embed for the deterministic hash embedder that
# keeps every smoke run offline. hive-node (lib) and hive-sync join the list as
# they land — `test_node()`/`test_pair()` are this crate's next growth ring
# (PLAN-v2.1 PR 4.5+), and test bodies must not have to change when they do.
hive-core = { path = "../core" }
hive-embed = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
# Writes the 64-hex master-key file whose reader lives in hive-core
# (keys::parse_master_key_hex) — one format, several consumers.
data-encoding = { workspace = true }
