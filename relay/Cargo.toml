[package]
name = "hive-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "hive-relay"
path = "src/bin/relay.rs"

[[bin]]
name = "hive-relay-agent"
path = "src/bin/agent.rs"

[dependencies]
tokio = { workspace = true }
# Only for the loopback admin endpoint (status + Traefik config). The data
# path never touches it: there is no HTTP anywhere near a forwarded byte.
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
subtle = { workspace = true }
nanoid = { workspace = true }
chrono = { workspace = true }

# TLS terminates on the INSTANCE, so rustls is an agent-side dependency. The
# daemon links it only for the ClientHello peek, which does no crypto.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }

[dev-dependencies]
# The blindness proof needs a real certificate for `<id>.<zone>` and a real
# handshake, and a public CA cannot issue for `relay.test`. Issued in-process,
# thrown away with the temp dir. `ring` rather than the default aws-lc-rs: the
# tree already links ring through tokio-rustls, and aws-lc-rs would drag cmake
# and a C toolchain into CI for a test fixture.
rcgen = { version = "0.14", default-features = false, features = [
    "pem",
    "ring",
] }
