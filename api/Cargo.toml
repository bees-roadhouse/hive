[package]
name = "hive-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
pgvector = { workspace = true }
reqwest = { workspace = true }

hive-shared = { workspace = true }
hive-core = { path = "../core" }

# Auth
jsonwebtoken = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }


# Misc
nanoid = { workspace = true }
uuid = { workspace = true }
dotenvy = { workspace = true }
async-stream = "0.3"
urlencoding = "2.1"
# ReaderStream: an AsyncRead from the artifact storage driver becomes a
# streaming response body without buffering the object.
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
# Tests wrap the storage driver's write trait to interleave an upload with a
# concurrent delete at an exact point (tests/artifacts.rs).
async-trait = { workspace = true }
# Test-only: streaming upload bodies (tests/artifacts.rs) and the concurrent
# OAuth-code redemption race (tests/privilege_escalation.rs).
futures = "0.3"
# Test-only: tests seed embedding rows and install a fake 384-dim provider.
# The binary reaches the embedder through hive-core, not directly.
hive-embed = { workspace = true }
